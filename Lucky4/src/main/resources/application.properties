spring.application.name=lucky4
server.port=8080
spring.web.resources.cache.period=0

# Chance (0.0 - 1.0) that a spin is a jackpot. 0.25 = 25%.
lucky4.jackpot-chance=0.35

# Code needed on the edit page (http://localhost:8080/edit.html).
# CHANGE THIS. Leave it empty to turn the code off.
lucky4.edit-code=lucky4

# Edited member details and uploaded photos are saved in this folder.
lucky4.data-dir=data

# Photo upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB